name: Release Python SDK
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --locked
      - name: Match release tag to package version
        run: |
          uv run python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v'
      - name: Detect pre-release version
        id: version
        run: |
          uv run python -c 'import tomllib; from packaging.version import Version; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; print("prerelease=" + str(Version(v).is_prerelease).lower())' >> "$GITHUB_OUTPUT"
      - run: uv run ruff check . && uv run mypy src examples && uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.11.27
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = false ]; then
            gh release create "$RELEASE_TAG" --title "ThunderID Python SDK $RELEASE_TAG" --generate-notes
          else
            gh release create "$RELEASE_TAG" --title "ThunderID Python SDK $RELEASE_TAG" --generate-notes --prerelease
          fi
