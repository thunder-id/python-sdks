[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "thunderid"
version = "0.1.0"
description = "Async Python client for the ThunderID open-source IAM stack"
authors = [{name = "The ThunderID Authors"}]
keywords = ["thunderid", "iam", "oauth2", "openid-connect", "authentication", "ai-agents", "asyncio"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "PyJWT[crypto]>=2.10.1,<3", "keyring>=25.6,<26"]

[project.urls]
Homepage = "https://github.com/thunder-id/python-sdks#readme"
Documentation = "https://github.com/thunder-id/python-sdks/tree/main/docs"
Repository = "https://github.com/thunder-id/python-sdks"
Issues = "https://github.com/thunder-id/python-sdks/issues"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11",
    "mypy>=1.15",
    "build>=1.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/thunderid"]
